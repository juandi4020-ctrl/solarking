CancelEvent:
  Conditions:
  - incombat true
  Skills:
  - CancelEvent @self

void_storm_summoned:
  Skills:
  - CancelEvent @self
  - state{model=void_storm;state=void_storm} @self
  - look{headOnly=false;immediately=true} @target
  - bodyclamp{mh=0;mb=0} @self
  - sound{s=custom.void_storm;v=3;p=1} @self
  - delay 10
  - lockmodel @self
  - delay 31
  - aura{auraName=storm1;oT=storm1_damage;duration=8} @self
  - delay 7
  - aura{auraName=storm2;oT=storm2_damage;duration=8} @self
  - delay 6
