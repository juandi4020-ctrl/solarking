CancelEvent:
  Conditions:
  - incombat true
  Skills:
  - CancelEvent @self

beam_summoned:
  Skills:
  - CancelEvent @self
  - state{model=beam;state=beam} @self
  - delay 20
  - lockmodel @self
  - delay 10
  - sound{s=custom.beam;v=3;p=1} @self
  - delay 5
  - aura{auraName=beamD;oT=beam_damage;duration=60;interval=5} @self
  - delay 65
  - remove @self

