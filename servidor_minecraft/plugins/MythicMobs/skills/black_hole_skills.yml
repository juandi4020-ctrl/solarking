CancelEvent:
  Conditions:
  - incombat true
  Skills:
  - CancelEvent @self

black_hole_summoned:
  Skills:
  - CancelEvent @self
  - state{model=black_hole;state=black_hole} @self
  - lockmodel @self
  - sound{s=custom.black_hole;v=3;p=1} @self
  - delay 20
  - aura{auraName=blackHD1;oT=black_hole_damage1;duration=20} @self
  - delay 20
  - aura{auraName=blackHD2;oT=black_hole_damage2;duration=30} @self
  - delay 30
  - aura{auraName=blackHD3;oT=black_hole_damage3;duration=40} @self
